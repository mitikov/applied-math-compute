function openTab(n){current=n;resetPrediction();const c=cfg[n];el('title').textContent=c.title;el('story').textContent=c.story;el('ask').textContent=c.ask;el('legend').textContent=c.legend;el('controls').replaceChildren();for(const [id,title,opts] of c.spec){const label=document.createElement('label');label.textContent=title;let ctl;
 if(['t','h','b','n','w'].includes(id)){ctl=document.createElement('input');ctl.type='range';ctl.min=0;ctl.max=opts.length-1;ctl.step=1;const out=document.createElement('output');out.textContent=state[n][id];label.append(out);ctl.value=opts.indexOf(state[n][id]);ctl.oninput=()=>{state[n][id]=opts[Number(ctl.value)];out.textContent=state[n][id];ctl.setAttribute('aria-valuetext',out.textContent);resetPrediction();run()};ctl.setAttribute('aria-valuetext',state[n][id]);}
 else{ctl=document.createElement('select');for(const [j,o] of opts.entries()){const opt=new Option(o,j);ctl.add(opt)}ctl.value=opts.indexOf(state[n][id]);ctl.onchange=()=>{state[n][id]=opts[Number(ctl.value)];resetPrediction();run()}}
 ctl.id='param-'+id;label.append(ctl);el('controls').append(label)}
 [...el('tabs').children].forEach((b,i)=>b.setAttribute('aria-pressed',i===n));run();}
cfg.forEach((c,i)=>{const btn=document.createElement('button');btn.textContent=c.tab;btn.onclick=()=>{location.hash='task-'+(i+1);openTab(i)};el('tabs').append(btn)});
el('reveal').onclick=()=>{shown=!shown;run()};el('test').onclick=()=>{const raw=el('prediction').value.trim().replace(',','.');const value=Number(raw);if(!raw||!Number.isFinite(value)){el('feedback').textContent='Введіть числовий прогноз.';return}
 el('feedback').textContent=Math.abs(value-answer)<=(current===3?.051:.0051)?'Прогноз збігається з розрахунком.':'Різниця між вашим прогнозом і розрахунком: '+fmt(value-answer)+'.';shown=true;run()};
el('keep').onclick=()=>{records.push(snapshot);const li=document.createElement('li');li.textContent=snapshot;el('history').append(li);el('count').textContent='Записів: '+records.length;shown=true;run()};
el('save').onclick=()=>{if(!records.length){el('count').textContent='Спершу запишіть хоча б один дослід.';return}const url=URL.createObjectURL(new Blob([records.join('\n\n')],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='lab-06-observations.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)};
const fromHash=()=>{const m=location.hash.match(/^#task-([1-4])$/);return m?Number(m[1])-1:0};window.addEventListener('hashchange',()=>{if(current!==fromHash())openTab(fromHash())});openTab(fromHash());
</script></html>
